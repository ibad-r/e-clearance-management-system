          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/VerificationResult'
                required:
                - data
                additionalProperties: false
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found or hidden by access policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Invalid state transition or duplicate active request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Semantic validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    caseId:
      name: caseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    issueId:
      name: issueId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    resolutionId:
      name: resolutionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    notificationId:
      name: notificationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    approvalId:
      name: approvalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    employeeId:
      name: employeeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    departmentId:
      name: departmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    certificateId:
      name: certificateId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    templateId:
      name: templateId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    token:
      name: token
      in: path
      required: true
      schema:
        type: string
        minLength: 24
  schemas:
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
      required:
      - email
      - password
      additionalProperties: false
    LoginResult:
      type: object
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        user:
          $ref: '#/components/schemas/CurrentUser'
      required:
      - accessToken
      - tokenType
      - user
      additionalProperties: false
    CurrentUser:
      type: object
      properties:
        id: &id001
          type: string
          format: uuid
        email:
          type: string
          format: email
        fullName:
          type: string
        role:
          type: string
          enum:
          - EMPLOYEE
          - HR_OFFICER
          - APPROVER
          - SYSTEM_ADMIN
      required:
      - id
      - email
      - fullName
      - role
      additionalProperties: false
    CreateCaseRequest:
      type: object
      properties:
        employeeId: *id001
        lastWorkingDate: &id002
          type: string
          format: date
        reasonForLeaving:
          type: string
          minLength: 3
          maxLength: 500
      required:
      - employeeId
      - lastWorkingDate
      - reasonForLeaving
      additionalProperties: false
    UpdateCaseRequest:
      type: object
      properties:
        lastWorkingDate: *id002
        reasonForLeaving:
          type: string
          minLength: 3
        employeeRemarks:
          type: string
          nullable: true
      additionalProperties: false
    SubmitCaseRequest:
      type: object
      properties:
        employeeRemarks:
          type: string
          maxLength: 1000
          nullable: true
      additionalProperties: false
    ResolutionRequest:
      type: object
      properties:
        explanation:
          type: string
          minLength: 3
          maxLength: 2000
      required:
      - explanation
      additionalProperties: false
    AttachmentUpload:
      type: object
      properties:
        file:
          type: string
          format: binary
      required:
      - file
    RecheckRequest:
      type: object
      properties:
        stageId: *id001
      required:
      - stageId
      additionalProperties: false
    ResumeApprovalRequest:
      type: object
      properties:
        remarks:
          type: string
          minLength: 3
      required:
      - remarks
      additionalProperties: false
    CancelCaseRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 3
      required:
      - reason
      additionalProperties: false
    ApproveRequest:
      type: object
      properties:
        remarks:
          type: string
          maxLength: 1000
      additionalProperties: false
    ReturnRequest:
      type: object
      properties:
        remarks:
          type: string
          minLength: 3
          maxLength: 1000
      required:
      - remarks
      additionalProperties: false
    DemoDataRequest:
      type: object
      properties:
        values:
          type: object
          additionalProperties:
            oneOf:
            - type: number
            - type: boolean
            - type: string
          example:
            outstanding_dues: 0
      required:
      - values
      additionalProperties: false
    CreateWorkflowRequest:
      type: object
      properties:
        categoryId: *id001
        name:
          type: string
          minLength: 3
        version:
          type: integer
          minimum: 1
        stages:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              departmentId: *id001
              ruleId: *id001
              stepOrder:
                type: integer
                minimum: 1
              isRequired:
                type: boolean
            required:
            - departmentId
            - ruleId
            - stepOrder
            additionalProperties: false
        approvals:
          type: array
          items:
            type: object
            properties:
              positionId: *id001
              stepOrder:
                type: integer
                minimum: 1
              isRequired:
                type: boolean
            required:
            - positionId
            - stepOrder
            additionalProperties: false
      required:
      - categoryId
      - name
      - version
      - stages
      - approvals
      additionalProperties: false
    CreateUserRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        fullName:
          type: string
        role:
          type: string
          enum:
          - EMPLOYEE
          - HR_OFFICER
          - APPROVER
          - SYSTEM_ADMIN
        password:
          type: string
          minLength: 8
      required:
      - email
      - fullName
      - role
      - password
      additionalProperties: false
    Stage:
      type: object
      properties:
        id: *id001
        departmentId: *id001
        stepOrder:
          type: integer
        status:
          type: string
          enum:
          - LOCKED
          - CHECKING
          - CLEARED
          - OUTSTANDING
          - RECHECKING
          - SKIPPED
        outstandingNote:
          type: string
          nullable: true
      required:
      - id
      - departmentId
      - stepOrder
      - status
      additionalProperties: false
    Approval:
      type: object
      properties:
        id: *id001
        positionId: *id001
        stepOrder:
          type: integer
        status:
          type: string
          enum: *id003
        assignedUserId:
          type: string
          format: uuid
          nullable: true
      required:
      - id
      - positionId
      - stepOrder
      - status
      additionalProperties: false
    CaseDetail:
      type: object
      properties:
        id: *id001
        requestCode:
          type: string
        employeeId: *id001
        status:
          type: string
          enum: *id004
        reasonForLeaving:
          type: string
        lastWorkingDate: *id002
        stages:
          type: array
          items:
            $ref: '#/components/schemas/Stage'
        approvals:
          type: array
          items:
            $ref: '#/components/schemas/Approval'
        issues:
          type: array
          items:
            $ref: '#/components/schemas/Issue'
        certificateId:
          type: string
          format: uuid
          nullable: true
      required:
      - id
      - requestCode
      - employeeId
      - status
      - lastWorkingDate
      - stages
      - approvals
      additionalProperties: false
    CaseList:
      type: array
      items:
        $ref: '#/components/schemas/CaseDetail'
    EmployeeList:
      type: array
      items:
        type: object
        properties:
          id: *id001
          employeeNumber:
            type: string
          fullName:
            type: string
          designation:
            type: string
          categoryId: *id001
        required:
        - id
        - employeeNumber
        - fullName
        additionalProperties: false
    ResolutionResult:
      type: object
      properties:
        id: *id001
        issueId: *id001
        explanation:
          type: string
        submittedAt:
          type: string
          format: date-time
      required:
      - id
      - issueId
      - explanation
      additionalProperties: false
    AttachmentResult:
      type: object
      properties:
        id: *id001
        originalName:
          type: string
        sizeBytes:
          type: integer
      required:
      - id
      - originalName
      additionalProperties: false
    NotificationItem:
      type: object
      properties:
        id: *id001
        title:
          type: string
        message:
          type: string
        readAt:
          type: string
          format: date-time
          nullable: true
      required:
      - id
      - title
      - message
      additionalProperties: false
    NotificationList:
      type: array
      items:
        $ref: '#/components/schemas/NotificationItem'
    ApprovalResult:
      $ref: '#/components/schemas/Approval'
    ApprovalList:
      type: array
      items:
        $ref: '#/components/schemas/Approval'
    GenericList:
      type: array
      items:
        type: object
        additionalProperties: true
    WorkflowResult:
      type: object
      properties:
        id: *id001
        categoryId: *id001
        name:
          type: string
        version:
          type: integer
        isActive:
          type: boolean
      required:
      - id
      - categoryId
      - name
      - version
      - isActive
      additionalProperties: false
    DemoDataResult:
      type: object
      properties:
        employeeId: *id001
        departmentId: *id001
        values:
          type: object
          additionalProperties: true
      required:
      - employeeId
      - departmentId
      - values
      additionalProperties: false
    VerificationResult:
      type: object
      properties:
        valid:
          type: boolean
        certificateNumber:
          type: string
          nullable: true
        clearanceStatus:
          type: string
          enum:
          - COMPLETED
          - NOT_VALID
        issuedAt:
          type: string
          format: date-time
          nullable: true
      required:
      - valid
      - clearanceStatus
      additionalProperties: false
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              nullable: true
              additionalProperties: true
          required:
          - code
          - message
          additionalProperties: false
      required:
      - error
      additionalProperties: false
    Issue:
      type: object
      properties:
        id: *id001
        requestStageId: *id001
        status:
          type: string
          enum:
          - OPEN
          - RESOLVED
        reason:
          type: string
        resolutions:
          type: array
          items:
            $ref: '#/components/schemas/ResolutionResult'
      required:
      - id
      - requestStageId
      - status
      - reason
      additionalProperties: false
    CreateEmployeeCaseRequest:
      type: object
      properties:
        lastWorkingDate:
          type: string
          format: date
          description: ISO date YYYY-MM-DD; year must be 0001 through 9999.
        reasonForLeaving:
          type: string
          minLength: 3
          maxLength: 500
          description: Trimmed by the API before validation.
        employeeRemarks:
          type: string
          maxLength: 1000
          nullable: true
          description: Optional; may be omitted or null.
      required:
      - lastWorkingDate
      - reasonForLeaving
      additionalProperties: false
    EmployeeCase:
      type: object
      properties:
        id:
          type: string
          format: uuid
        requestCode:
          type: string
        employeeId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - PENDING_SUBMISSION
          - IN_PROGRESS
          - ACTION_REQUIRED
          - AWAITING_APPROVAL
          - RETURNED_FOR_CORRECTION
          - COMPLETED
          - CANCELLED
        reasonForLeaving:
          type: string
        lastWorkingDate:
          type: string
          format: date
        employeeRemarks:
          type: string
          nullable: true
        initiatedAt:
          type: string
          format: date-time
        submittedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        cancelledAt:
          type: string
          format: date-time
          nullable: true
        stages:
          type: array
          items:
            $ref: '#/components/schemas/EmployeeStage'
        approvals:
          type: array
          items:
            $ref: '#/components/schemas/EmployeeApproval'
        issues:
          type: array
          items:
            $ref: '#/components/schemas/EmployeeIssue'
        certificateId:
          type: string
          format: uuid
          nullable: true
        progress:
          $ref: '#/components/schemas/EmployeeCaseProgress'
      required:
      - id
      - requestCode
      - employeeId
      - status
      - reasonForLeaving
      - lastWorkingDate
      - employeeRemarks
      - initiatedAt
      - submittedAt
      - completedAt
      - cancelledAt
      - stages
      - approvals
      - issues
      - certificateId
      - progress
      additionalProperties: false
    EmployeeStage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        departmentId:
          type: string
          format: uuid
        departmentCode:
          type: string
        departmentName:
          type: string
        stepOrder:
          type: integer
        isRequired:
          type: boolean
        status:
          type: string
          enum:
          - LOCKED
          - CHECKING
          - CLEARED
          - OUTSTANDING
          - RECHECKING
          - SKIPPED
        outstandingNote:
          type: string
          nullable: true
        startedAt:
          type: string
          format: date-time
          nullable: true
        lastCheckedAt:
          type: string
          format: date-time
          nullable: true
        clearedAt:
          type: string
          format: date-time
          nullable: true
      required:
      - id
      - departmentId
      - departmentCode
      - departmentName
      - stepOrder
      - isRequired
      - status
      - outstandingNote
      - startedAt
      - lastCheckedAt
      - clearedAt
      additionalProperties: false
    EmployeeApproval:
      type: object
      properties:
        id:
          type: string
          format: uuid
        positionId:
          type: string
          format: uuid
        positionTitle:
          type: string
        stepOrder:
          type: integer
        isRequired:
          type: boolean
        status:
          type: string
          enum:
          - WAITING
          - PENDING
          - APPROVED
          - RETURNED
          - SKIPPED
      required:
      - id
      - positionId
      - positionTitle
      - stepOrder
      - isRequired
      - status
      additionalProperties: false
    EmployeeIssue:
      type: object
      properties:
        id:
          type: string
          format: uuid
        requestStageId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - OPEN
          - RESOLVED
        reason:
          type: string
        openedAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
          nullable: true
      required:
      - id
      - requestStageId
      - status
      - reason
      - openedAt
      - resolvedAt
      additionalProperties: false
    EmployeeCaseProgress:
      type: object
      properties:
        totalStages:
          type: integer
          minimum: 0
        clearedStages:
          type: integer
          minimum: 0
        outstandingStages:
          type: integer
          minimum: 0
        skippedStages:
          type: integer
          minimum: 0
      required:
      - totalStages
      - clearedStages
      - outstandingStages
      - skippedStages
      additionalProperties: false
    EmployeeCaseList:
      type: array
      items:
        $ref: '#/components/schemas/EmployeeCase'
