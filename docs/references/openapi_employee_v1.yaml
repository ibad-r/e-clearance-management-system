openapi: 3.0.3
info:
  title: E-Clearance API - Employee MVP and proposed Student contract
  version: 1.2.0-draft
  description: Draft API contract for Faculty of Computing Employee Clearance MVP. HR-policy mappings unconfirmed; controlled
    departmental data only. No real university integration. The current app mounts shared email/password authentication
    and the four Employee profile/case operations through requireAuth and requireRole("EMPLOYEE"). Older HR initiation
    and separate employee submission operations remain legacy planned contracts outside Issue 11. Issue 17 adds proposed,
    unimplemented Student operations for Issue 18; DTOs, digital statuses, applicability and lifecycle fields await acceptance.
    The local shared role enum does not yet contain STUDENT. Shared email-or-SAP-ID login remains an Issue 16 coordination
    dependency with no approved technical input/lookup shape. No Student route, schema or migration is implemented here.
  x-student-contract-status: proposed-unimplemented
  x-student-decision-register: ../implementation/student-api-contract.md
  x-student-flutter-handoff: ../implementation/student-flutter-handoff.md
servers:
- url: http://localhost:4000/api/v1
  description: Local development; use HTTPS for deployed environment
tags:
- name: Auth
- name: Employee
- name: Student
  description: Proposed own-profile/request contract only; see Issue 17 decisions U01-U18 before implementation or client generation.
- name: Notifications
- name: HR
- name: Approver
- name: System Admin
- name: Certificates
security:
- bearerAuth: []
paths:
  /auth/login:
    post:
      tags:
      - Auth
      summary: Sign in with pre-created account
      description: >-
        Verified current strict email/password login for an active Admin-pre-created shared account; no signup.
        Email is lowercased for exact lookup, without trimming or university-domain restrictions; password is not trimmed.
        Extra fields, including sapId or identifier, fail validation. Student email-or-SAP-ID login is a product direction
        pending Issue 16 input/lookup confirmation; it is not supported by this local branch.
      operationId: post_auth_login
      x-required-roles:
      - PUBLIC
      x-implementation-priority: P0
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Shared login response at the top level; no data envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '400':
          description: VALIDATION_ERROR for invalid strict body or malformed JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: UNAUTHORIZED with generic Invalid credentials for unknown, inactive or incorrect-password accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: INTERNAL_SERVER_ERROR for unexpected service or token-configuration failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/me:
    get:
      tags:
      - Auth
      summary: Read signed-in user and role
      description: >-
        Verifies the Bearer JWT, reloads the active user and requires signed/database role agreement.
        Returns shared account id, email, fullName and role; this is not a Student academic profile.
        Never trust a role supplied by the client.
      operationId: get_auth_me
      x-required-roles:
      - AUTHENTICATED
      x-implementation-priority: P0
      responses:
        '200':
          description: Shared account in the user field; no data envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/CurrentUser'
                required:
                - user
                additionalProperties: false
        '401':
          description: UNAUTHORIZED for missing/invalid/expired token, inactive/absent user or role mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: INTERNAL_SERVER_ERROR for unexpected active-user lookup failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /student/profile:
    get:
      tags: [Student]
      summary: Read own Student academic identity (proposed)
      operationId: get_student_profile
      x-required-roles: [STUDENT]
      x-implementation-status: proposed-unimplemented
      x-production-mounted: false
      x-open-decisions: [U12, U13, U16, U18]
      description: >-
        Issue 18 proposal. Resolve the linked Student profile only from verified req.auth.userId after shared
        requireAuth and requireRole("STUDENT"). Never use client IDs or unverified token claims to select an owner.
        Admin provisions accounts; no signup. Missing linked profile is proposed 404, not a fabricated profile.
      responses:
        '200':
          description: Proposed server-derived identity
          content:
            application/json:
              schema:
                type: object
                required: [data]
                additionalProperties: false
                properties:
                  data:
                    $ref: '#/components/schemas/StudentProfile'
        '401':
          $ref: '#/components/responses/StudentUnauthorized'
        '403':
          $ref: '#/components/responses/StudentForbidden'
        '404':
          $ref: '#/components/responses/StudentNotFound'
        '500':
          $ref: '#/components/responses/StudentInternalError'
  /student/dashboard:
    get:
      tags: [Student]
      summary: Read own active request, department progress and history (proposed)
      operationId: get_student_dashboard
      x-required-roles: [STUDENT]
      x-implementation-status: proposed-unimplemented
      x-production-mounted: false
      x-open-decisions: [U01, U02, U03, U05, U06, U07, U08, U09, U10, U11, U12, U16]
      description: >-
        Owner-scoped proposal consistent with the active request detail. With no active request return activeRequest
        null, departments [], progress null; closed history remains independently available. Progress counts never
        approve or complete a request. Do not compute an authoritative percentage while applicability is unresolved.
        Examination Department is an informational transcript next step, not a clearance stage or denominator.
      responses:
        '200':
          description: Proposed dashboard, including the no-active-request state
          content:
            application/json:
              schema:
                type: object
                required: [data]
                additionalProperties: false
                properties:
                  data:
                    $ref: '#/components/schemas/StudentDashboard'
        '401':
          $ref: '#/components/responses/StudentUnauthorized'
        '403':
          $ref: '#/components/responses/StudentForbidden'
        '404':
          $ref: '#/components/responses/StudentNotFound'
        '500':
          $ref: '#/components/responses/StudentInternalError'
  /student/requests:
    post:
      tags: [Student]
      summary: Submit own Student clearance request (proposed)
      operationId: post_student_requests
      x-required-roles: [STUDENT]
      x-implementation-status: proposed-unimplemented
      x-production-mounted: false
      x-open-decisions: [U01, U02, U03, U04, U05, U06, U07, U08, U09, U10, U11, U12, U14, U15, U16, U17, U18]
      description: >-
        One active request per Student is required; Issue 18 must enforce it under concurrent creation at the database
        boundary. Accept only the five submission fields; derive SAP ID, Student name and owner from the authenticated
        profile. Identity snapshot behavior, reference allocation/stability and lifecycle DTOs remain proposals.
        Allocate a server reference before 201; allocation failure is a server failure, not ACTIVE_REQUEST_EXISTS.
        Submission does not approve, clear or complete a request. Whether unresolved Lab applicability blocks submission
        is TBD. No retry/idempotency guarantee or terminal classification is approved.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStudentRequest'
      responses:
        '201':
          description: Proposed created request with server UUID, reference and profile identity
          content:
            application/json:
              schema:
                type: object
                required: [data]
                additionalProperties: false
                properties:
                  data:
                    $ref: '#/components/schemas/StudentRequest'
        '400':
          description: Malformed JSON follows the existing application parser's VALIDATION_ERROR envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/StudentUnauthorized'
        '403':
          $ref: '#/components/responses/StudentForbidden'
        '404':
          $ref: '#/components/responses/StudentNotFound'
        '409':
          description: Proposed ACTIVE_REQUEST_EXISTS conflict; active-slot terminal classification remains TBD
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/StudentValidationError'
        '500':
          $ref: '#/components/responses/StudentInternalError'
    get:
      tags: [Student]
      summary: List own current and historical requests (proposed)
      operationId: get_student_requests
      x-required-roles: [STUDENT]
      x-implementation-status: proposed-unimplemented
      x-production-mounted: false
      x-open-decisions: [U07, U08, U09, U10, U11, U16]
      description: >-
        Owner-scoped, initially unpaginated summary list is a proposal; ordering/pagination require acceptance.
        No client owner/filter parameter is defined. Empty history is 200 with data []; an absent linked profile is 404.
        No processing, terminal outcome, rejection, cancellation or reopening semantics are inferred from isActive.
      responses:
        '200':
          description: Proposed summary list, including an empty array
          content:
            application/json:
              schema:
                type: object
                required: [data]
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/StudentRequestSummary'
        '401':
          $ref: '#/components/responses/StudentUnauthorized'
        '403':
          $ref: '#/components/responses/StudentForbidden'
        '404':
          $ref: '#/components/responses/StudentNotFound'
        '500':
          $ref: '#/components/responses/StudentInternalError'
  /student/requests/{requestId}:
    get:
      tags: [Student]
      summary: Read own request and read-only department states (proposed)
      operationId: get_student_requests__requestId_
      x-required-roles: [STUDENT]
      x-implementation-status: proposed-unimplemented
      x-production-mounted: false
      x-open-decisions: [U01, U02, U03, U05, U06, U07, U08, U09, U11, U16]
      description: >-
        UUID locates a request; verified Student ownership must also constrain the lookup. Missing and foreign requests
        both produce proposed 404. Students cannot write department status/applicability. The official five-entry form
        is a working roster; Transport versus conditional Laboratory remains unresolved, not silently chosen or merged.
        No request-status enum, completion/closure rule, sequential unlocking or signature/stamp DTO is invented.
      parameters:
      - name: requestId
        in: path
        required: true
        description: Server request UUID, distinct from the proposed human-readable requestReference
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Proposed own request detail
          content:
            application/json:
              schema:
                type: object
                required: [data]
                additionalProperties: false
                properties:
                  data:
                    $ref: '#/components/schemas/StudentRequest'
        '401':
          $ref: '#/components/responses/StudentUnauthorized'
        '403':
          $ref: '#/components/responses/StudentForbidden'
        '404':
          $ref: '#/components/responses/StudentNotFound'
        '422':
          $ref: '#/components/responses/StudentValidationError'
        '500':
          $ref: '#/components/responses/StudentInternalError'
