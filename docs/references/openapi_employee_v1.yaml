components:
  responses:
    StudentUnauthorized:
      description: Proposed use of shared auth 401 UNAUTHORIZED for absent, invalid, expired or inactive identity
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    StudentForbidden:
      description: Proposed use of shared role 403 FORBIDDEN for a verified non-STUDENT account
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    StudentNotFound:
      description: Proposed 404 NOT_FOUND for absent linked profile, or missing/foreign request without ownership disclosure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    StudentValidationError:
      description: Proposed 422 VALIDATION_ERROR for submission JSON types/fields or malformed request UUID; academic rules TBD
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    StudentInternalError:
      description: Proposed 500 INTERNAL_SERVER_ERROR without driver details, credentials or reference-allocation internals
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    EmployeeUnauthorized:
      description: Shared verifier returns UNAUTHORIZED for absent/invalid/expired tokens, inactive/absent users or signed/database role mismatch. The Employee principal/service seam can return UNAUTHENTICATED for a missing/malformed principal or absent user.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    EmployeeForbidden:
      description: Shared role gate rejects non-EMPLOYEE accounts; the Employee service also rejects ineligible role/activity or non-FC profiles; FORBIDDEN. An inactive user detected by shared authentication returns 401 first.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    EmployeeNotFound:
      description: Linked employee or owned case not found; NOT_FOUND
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    EmployeeConflict:
      description: Existing nonterminal case, request-code conflict or concurrent case creation conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    EmployeeValidationError:
      description: Invalid strict body, UUID path or status query; VALIDATION_ERROR
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    EmployeeConfigurationError:
      description: Active category workflow missing or configuration ineligible; WORKFLOW_NOT_CONFIGURED or WORKFLOW_CONFIGURATION_INVALID
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    EmployeeInternalError:
      description: Unexpected failure; INTERNAL_SERVER_ERROR without driver details or credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Current HS256 JWT; issuer e-clearance-backend, audience e-clearance-api, shared users.id in sub. Shared verifier reloads the active user and checks signed/database role agreement.
  parameters:
    caseId:
      name: caseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    issueId:
      name: issueId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    resolutionId:
      name: resolutionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    notificationId:
      name: notificationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    approvalId:
      name: approvalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    employeeId:
      name: employeeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    departmentId:
      name: departmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    certificateId:
      name: certificateId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    templateId:
      name: templateId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    token:
      name: token
      in: path
      required: true
      schema:
        type: string
        minLength: 24
  schemas:
    StudentProfile:
      type: object
      x-contract-status: proposed
      description: >-
        Server-derived Student academic identity. Authoritative SAP/name columns, users.id mapping, uniqueness,
        normalization and provisioning remain U12/U13. Request submission fields do not become profile identity.
      required: [sapId, studentName]
      additionalProperties: false
      properties:
        sapId:
          type: string
          readOnly: true
          description: Keep string representation; leading zeros and authoritative lookup rules remain TBD
        studentName:
          type: string
          readOnly: true
          description: Profile-derived; relationship to users.fullName and synchronization remain TBD
    StudentRequestReason:
      type: string
      x-contract-status: proposed-wire-literals
      description: Confirmed reason meanings; exact wire literals await U15 acceptance
      enum: [degree completed, discontinuing studies]
    CreateStudentRequest:
      type: object
      x-contract-status: proposed
      description: >-
        Only five submitted fields. Reject extra fields, including sapId, studentName, studentId, userId, role, id,
        requestReference, departments and lifecycle metadata. Presence/non-null JSON types are proposed requiredness;
        blank/trim/length/format rules, program lists and semester representation remain U14. No academic rules inferred.
      required: [registrationNumber, fatherName, program, semester, reason]
      additionalProperties: false
      properties:
        registrationNumber:
          type: string
        fatherName:
          type: string
        program:
          type: string
        semester:
          type: string
          description: Provisional string; integer versus string and allowed academic values remain TBD
        reason:
          $ref: '#/components/schemas/StudentRequestReason'
    StudentDepartmentCode:
      type: string
      x-contract-status: proposed
      description: >-
        Proposed business codes for the printed official form, not database UUIDs or a resolved operational roster.
        Library; Fee & Dues Department; Student Service Department; Laboratory (If required); Coordination Office.
        The older overview includes Transport and omits Laboratory; resolve U01/U02 before freezing the roster.
        Examination Department is informational for transcript after clearance, not a clearance stage.
      enum: [LIBRARY, FEE_DUES, STUDENT_SERVICE, LABORATORY, COORDINATION_OFFICE]
    StudentDepartmentStatus:
      type: string
      x-contract-status: proposed-not-university-policy
      description: >-
        Proposed digital API values, not confirmed university policy or verified screen labels. PENDING means no
        recorded determination; IN_REVIEW explicitly recorded review; CLEARED recorded clearance; ACTION_REQUIRED
        recorded outstanding matter; NOT_REQUIRED explicit exemption, never equivalent to CLEARED.
        Initial states, transitions and authorized writers remain U05.
      enum: [PENDING, IN_REVIEW, CLEARED, ACTION_REQUIRED, NOT_REQUIRED]
    StudentDepartmentApplicability:
      type: string
      x-contract-status: proposed-not-university-policy
      description: >-
        Applicability is distinct from clearance. Laboratory stays UNDETERMINED until an authorized determination
        under confirmed rules; ordinary-department exceptions, authority and submission blocking remain U03/U04.
      enum: [REQUIRED, NOT_REQUIRED, UNDETERMINED]
    StudentDepartment:
      type: object
      x-contract-status: proposed
      description: >-
        Read-only for Students. Proposed consistency: REQUIRED permits PENDING/IN_REVIEW/CLEARED/ACTION_REQUIRED;
        NOT_REQUIRED pairs only with status NOT_REQUIRED; UNDETERMINED pairs only with PENDING. Keep all five working
        form entries visible, including exempt Laboratory; no automatic clearance or sequential/unlocking meaning.
        Lab is UNDETERMINED/PENDING until confirmed. Remarks visibility is U06; return null until visibility/source is
        agreed. A recorded UTC update time or null is proposed. Signature/stamp evidence remains TBD.
      required: [departmentCode, displayName, applicability, status, remarks, updatedAt]
      additionalProperties: false
      properties:
        departmentCode:
          $ref: '#/components/schemas/StudentDepartmentCode'
        displayName:
          type: string
        applicability:
          $ref: '#/components/schemas/StudentDepartmentApplicability'
        status:
          $ref: '#/components/schemas/StudentDepartmentStatus'
        remarks:
          type: string
          nullable: true
          description: Only approved Student-visible remarks; null while visibility/source is unresolved
        updatedAt:
          type: string
          format: date-time
          nullable: true
      oneOf:
      - properties:
          applicability:
            enum: [REQUIRED]
          status:
            enum: [PENDING, IN_REVIEW, CLEARED, ACTION_REQUIRED]
      - properties:
          applicability:
            enum: [NOT_REQUIRED]
          status:
            enum: [NOT_REQUIRED]
      - properties:
          applicability:
            enum: [UNDETERMINED]
          status:
            enum: [PENDING]
    StudentRequestSummary:
      type: object
      x-contract-status: proposed
      description: >-
        Provisional summary; isActive/submittedAt/closedAt do not define processing state, terminal outcome, closure
        reason/actor or completion/rejection/cancellation/reopening. U07-U11 remain open. closedAt null alone never proves
        activity. Reference is server-allocated before 201, separate from UUID; namespace/format/sequence/stability TBD.
        Fictional examples use Example reference A/B, without prescribing a production reference format.
      required: &studentSummaryRequired [id, requestReference, reason, isActive, submittedAt, closedAt]
      additionalProperties: false
      properties: &studentSummaryProperties
        id:
          type: string
          format: uuid
          readOnly: true
        requestReference:
          type: string
          readOnly: true
        reason:
          $ref: '#/components/schemas/StudentRequestReason'
        isActive:
          type: boolean
          readOnly: true
        submittedAt:
          type: string
          format: date-time
          readOnly: true
        closedAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
    StudentRequest:
      type: object
      x-contract-status: proposed
      description: >-
        Proposed detail/creation DTO with server-copied identity; snapshots versus live profile/applicability and
        historical correction remain U11/U12. isActive and closure fields have only the provisional summary meaning.
        Department roster/status proposals and all U01-U18 limits apply. No overall request-status enum is defined.
      required: [id, requestReference, sapId, studentName, registrationNumber, fatherName, program, semester, reason, isActive, submittedAt, closedAt, departments]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        requestReference:
          type: string
          readOnly: true
          description: Server-allocated reference; format, namespace and stability remain U07
        sapId:
          type: string
          readOnly: true
        studentName:
          type: string
          readOnly: true
        registrationNumber:
          type: string
        fatherName:
          type: string
        program:
          type: string
        semester:
          type: string
        reason:
          $ref: '#/components/schemas/StudentRequestReason'
        isActive:
          type: boolean
          readOnly: true
        submittedAt:
          type: string
          format: date-time
          readOnly: true
        closedAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        departments:
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/StudentDepartment'
    StudentProgress:
      type: object
      x-contract-status: proposed
      description: >-
        Counts for the active request only. requiredCount counts REQUIRED applicability; clearedRequiredCount and
        actionRequiredCount count only REQUIRED entries with their respective statuses; notRequiredCount counts explicit
        exemptions; undeterminedCount counts unresolved applicability separately. Exemptions are not clearances.
        Counts never approve/complete a request. No authoritative percentage while applicability is unresolved.
      required: &studentProgressRequired [requiredCount, clearedRequiredCount, actionRequiredCount, notRequiredCount, undeterminedCount]
      additionalProperties: false
      properties: &studentProgressProperties
        requiredCount:
          type: integer
          minimum: 0
        clearedRequiredCount:
          type: integer
          minimum: 0
        actionRequiredCount:
          type: integer
          minimum: 0
        notRequiredCount:
          type: integer
          minimum: 0
        undeterminedCount:
          type: integer
          minimum: 0
    StudentDashboard:
      type: object
      x-contract-status: proposed
      description: >-
        Owner-scoped DTO recommendation awaiting U16 acceptance. No active request means activeRequest null, departments
        [], progress null; history is independent. Active summary and department/progress data must agree with detail.
        Closed count and latest summary depend on unapproved terminal classifications U08-U11, not implied completion.
      required: [profile, activeRequest, departments, progress, history]
      additionalProperties: false
      properties:
        profile:
          $ref: '#/components/schemas/StudentProfile'
        activeRequest:
          type: object
          nullable: true
          description: Proposed active summary with StudentRequestSummary fields, or null; terminal classification remains TBD
          required: *studentSummaryRequired
          additionalProperties: false
          properties: *studentSummaryProperties
        departments:
          type: array
          items:
            $ref: '#/components/schemas/StudentDepartment'
        progress:
          type: object
          nullable: true
          description: Proposed StudentProgress counts for the active request, or null when none; never approval/completion
          required: *studentProgressRequired
          additionalProperties: false
          properties: *studentProgressProperties
        history:
          type: object
          required: [closedRequestCount, latestClosedRequest]
          additionalProperties: false
          properties:
            closedRequestCount:
              type: integer
              minimum: 0
            latestClosedRequest:
              type: object
              nullable: true
              description: Proposed closed summary with StudentRequestSummary fields, or null; no terminal outcome is implied
              required: *studentSummaryRequired
              additionalProperties: false
              properties: *studentSummaryProperties
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
      required:
      - email
      - password
      additionalProperties: false
    LoginResult:
      type: object
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum: [Bearer]
          example: Bearer
        expiresIn:
          type: integer
          minimum: 60
          maximum: 3600
          description: JWT_ACCESS_TTL_SECONDS; defaults to 900 seconds
        user:
          $ref: '#/components/schemas/CurrentUser'
      required:
      - accessToken
      - tokenType
      - expiresIn
      - user
      additionalProperties: false
    CurrentUser:
      type: object
      description: Current local shared account fields; STUDENT role is pending Issue 16 integration, not in this branch's enum.
      properties:
        id: &id002
          type: string
          format: uuid
        email:
          type: string
          format: email
        fullName:
          type: string
        role:
          type: string
          enum:
          - EMPLOYEE
          - HR_OFFICER
          - APPROVER
          - SYSTEM_ADMIN
      required:
      - id
      - email
      - fullName
      - role
      additionalProperties: false
    CreateCaseRequest:
      type: object
      properties:
        employeeId: *id002
        lastWorkingDate: &id003
          type: string
          format: date
        reasonForLeaving:
          type: string
          minLength: 3
          maxLength: 500
      required:
      - employeeId
      - lastWorkingDate
      - reasonForLeaving
      additionalProperties: false
    CreateEmployeeCaseRequest:
      type: object
      description: Employee self-submission. Identity, workflow, status and timestamps are server-controlled. Text is trimmed before length validation.
      properties:
        lastWorkingDate:
          type: string
          format: date
          description: A real ISO calendar date with year 0001 through 9999; no institutional date cutoff is assumed.
          pattern: '^(?!0000)[0-9]{4}-[0-9]{2}-[0-9]{2}$'
        reasonForLeaving:
          type: string
          minLength: 3
          maxLength: 500
        employeeRemarks:
          type: string
          maxLength: 1000
          nullable: true
      required:
      - lastWorkingDate
      - reasonForLeaving
      additionalProperties: false
    EmployeeCategory:
      type: object
      properties:
        id: *id002
        code:
          type: string
        name:
          type: string
      required:
      - id
      - code
      - name
      additionalProperties: false
    EmployeeProfile:
      type: object
      properties:
        id: *id002
        employeeNumber:
          type: string
        fullName:
          type: string
        designation:
          type: string
        facultyCode:
