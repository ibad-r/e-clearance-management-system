components:
  responses:
    StudentUnauthorized:
      description: '401 UNAUTHORIZED: invalid, absent, expired or inactive-user JWT.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    StudentForbidden:
      description: '403 FORBIDDEN: verified account is not a Student.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    StudentNotFound:
      description: >-
        404 STUDENT_PROFILE_NOT_FOUND for an absent linked profile, or NOT_FOUND for a missing or foreign
        request. Foreign existence is never disclosed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    StudentValidationError:
      description: >-
        422 VALIDATION_ERROR for invalid fields, UUID or query parameters; PROFILE_MISMATCH for submitted
        academic values differing from the stored profile.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    StudentInternalError:
      description: '500 INTERNAL_SERVER_ERROR: sanitized unexpected failure.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    EmployeeUnauthorized:
      description: Shared verifier returns UNAUTHORIZED for absent/invalid/expired tokens, inactive/absent users or signed/database role mismatch. The Employee principal/service seam can return UNAUTHENTICATED for a missing/malformed principal or absent user.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    EmployeeForbidden:
      description: Shared role gate rejects non-EMPLOYEE accounts; the Employee service also rejects ineligible role/activity or non-FC profiles; FORBIDDEN. An inactive user detected by shared authentication returns 401 first.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    EmployeeNotFound:
      description: Linked employee or owned case not found; NOT_FOUND
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    EmployeeConflict:
      description: Existing nonterminal case, request-code conflict or concurrent case creation conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    EmployeeValidationError:
      description: Invalid strict body, UUID path or status query; VALIDATION_ERROR
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    EmployeeConfigurationError:
      description: Active category workflow missing or configuration ineligible; WORKFLOW_NOT_CONFIGURED or WORKFLOW_CONFIGURATION_INVALID
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    EmployeeInternalError:
      description: Unexpected failure; INTERNAL_SERVER_ERROR without driver details or credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    StudentUnavailable:
      description: >-
        503 STUDENT_CONFIGURATION_INVALID, REQUEST_REFERENCE_UNAVAILABLE or REQUEST_CREATION_UNAVAILABLE. No
        partial submission is committed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Current HS256 JWT; issuer e-clearance-backend, audience e-clearance-api, shared users.id in sub. Shared verifier reloads the active user and checks signed/database role agreement.
  parameters:
    caseId:
      name: caseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    issueId:
      name: issueId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    resolutionId:
      name: resolutionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    notificationId:
      name: notificationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    approvalId:
      name: approvalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    employeeId:
      name: employeeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    departmentId:
      name: departmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    certificateId:
      name: certificateId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    templateId:
      name: templateId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    token:
      name: token
      in: path
      required: true
      schema:
        type: string
        minLength: 24
  schemas:
    StudentProfile:
      type: object
      required:
        - sapId
        - studentName
        - registrationNumber
        - fatherName
        - program
        - semester
      additionalProperties: false
      properties:
        sapId:
          type: string
          readOnly: true
          description: Unique opaque SAP string from student_profiles.sap_id; preserve case and leading zeros.
        studentName:
          type: string
          readOnly: true
          description: Current users.fullName; captured at request submission.
        registrationNumber:
          type: string
          minLength: 1
          pattern: \S
          description: Nonblank string, retained exactly; must match the stored profile on submission.
        fatherName:
          type: string
          minLength: 1
          pattern: \S
          description: Nonblank string, retained exactly; must match the stored profile on submission.
        program:
          type: string
          minLength: 1
          pattern: \S
          description: Nonblank string, retained exactly; must match the stored profile on submission.
        semester:
          type: string
          minLength: 1
          pattern: \S
          description: Nonblank string, retained exactly; must match the stored profile on submission.
      description: >-
        Linked profile resolved using verified JWT users.id. No client owner selector or profile editing
        endpoint.
    StudentRequestReason:
      type: string
      enum:
        - degree completed
        - discontinuing studies
    CreateStudentRequest:
      type: object
      required:
        - registrationNumber
        - fatherName
        - program
        - semester
        - reason
      additionalProperties: false
      properties:
        registrationNumber:
          type: string
          minLength: 1
          pattern: \S
          description: Nonblank string, retained exactly; must match the stored profile on submission.
        fatherName:
          type: string
          minLength: 1
          pattern: \S
          description: Nonblank string, retained exactly; must match the stored profile on submission.
        program:
          type: string
          minLength: 1
          pattern: \S
          description: Nonblank string, retained exactly; must match the stored profile on submission.
        semester:
          type: string
          minLength: 1
          pattern: \S
          description: Nonblank string, retained exactly; must match the stored profile on submission.
        reason:
          $ref: '#/components/schemas/StudentRequestReason'
      description: >-
        Exactly five fields. Academic strings must exactly match PostgreSQL profile values. Identity and
        status fields are rejected.
    StudentDepartmentCode:
      type: string
      enum:
        - LIBRARY
        - FEE_DUES
        - STUDENT_SERVICE
        - LABORATORY
        - COORDINATION_OFFICE
    StudentDepartmentStatus:
      type: string
      enum:
        - PENDING
        - IN_REVIEW
        - CLEARED
        - ACTION_REQUIRED
        - NOT_REQUIRED
    StudentDepartmentApplicability:
      type: string
      enum:
        - REQUIRED
        - NOT_REQUIRED
        - UNDETERMINED
    StudentDepartment:
      type: object
      required:
        - departmentCode
        - displayName
        - applicability
        - status
        - remarks
        - updatedAt
      additionalProperties: false
      properties:
        departmentCode:
          $ref: '#/components/schemas/StudentDepartmentCode'
        displayName:
          type: string
        applicability:
          $ref: '#/components/schemas/StudentDepartmentApplicability'
        status:
          $ref: '#/components/schemas/StudentDepartmentStatus'
        remarks:
          type: string
          nullable: true
          description: Always null until a Student-visible remarks policy is agreed.
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: Null until an actual department update is recorded.
      description: >-
        All five persisted departments are returned independently. No Student status writes or sequential
        unlocking.
      oneOf:
        - properties:
            applicability:
              enum:
                - REQUIRED
            status:
              enum:
                - PENDING
                - IN_REVIEW
                - CLEARED
                - ACTION_REQUIRED
        - properties:
            applicability:
              enum:
                - NOT_REQUIRED
            status:
              enum:
                - NOT_REQUIRED
        - properties:
            applicability:
              enum:
                - UNDETERMINED
            status:
              enum:
                - PENDING
    StudentRequestSummary:
      type: object
      required:
        - id
        - requestReference
        - reason
        - status
        - isActive
        - submittedAt
        - closedAt
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        requestReference:
          type: string
          readOnly: true
          description: >-
            Stable Student reference: SC- followed by 32 uppercase UUID hex characters. Not an ordered
            sequence.
        reason:
          $ref: '#/components/schemas/StudentRequestReason'
        status:
          $ref: '#/components/schemas/StudentRequestStatus'
        isActive:
          type: boolean
          readOnly: true
          description: True exactly when status is IN_PROGRESS.
        submittedAt:
          type: string
          format: date-time
          readOnly: true
        closedAt:
          type: string
          format: date-time
          readOnly: true
          nullable: true
    StudentRequest:
      type: object
      required:
        - id
        - requestReference
        - reason
        - status
        - isActive
        - submittedAt
        - closedAt
        - sapId
        - studentName
        - registrationNumber
        - fatherName
        - program
        - semester
        - departments
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        requestReference:
          type: string
          readOnly: true
          description: >-
            Stable Student reference: SC- followed by 32 uppercase UUID hex characters. Not an ordered
            sequence.
        reason:
          $ref: '#/components/schemas/StudentRequestReason'
        status:
          $ref: '#/components/schemas/StudentRequestStatus'
        isActive:
          type: boolean
          readOnly: true
          description: True exactly when status is IN_PROGRESS.
        submittedAt:
          type: string
          format: date-time
          readOnly: true
        closedAt:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        sapId:
          type: string
          readOnly: true
          description: Unique opaque SAP string from student_profiles.sap_id; preserve case and leading zeros.
        studentName:
          type: string
          readOnly: true
          description: Current users.fullName; captured at request submission.
        registrationNumber:
          type: string
          minLength: 1
          pattern: \S
          description: Nonblank string, retained exactly; must match the stored profile on submission.
        fatherName:
          type: string
          minLength: 1
          pattern: \S
          description: Nonblank string, retained exactly; must match the stored profile on submission.
        program:
          type: string
          minLength: 1
          pattern: \S
          description: Nonblank string, retained exactly; must match the stored profile on submission.
        semester:
          type: string
          minLength: 1
          pattern: \S
          description: Nonblank string, retained exactly; must match the stored profile on submission.
        departments:
          type: array
          minItems: 5
          maxItems: 5
          items:
            $ref: '#/components/schemas/StudentDepartment'
      description: >-
        Submission-time profile identity and academic snapshots. Subsequent profile changes do not rewrite
        this request.
    StudentProgress:
      type: object
      required:
        - requiredCount
        - clearedRequiredCount
        - actionRequiredCount
        - notRequiredCount
        - undeterminedCount
      additionalProperties: false
      properties:
        requiredCount:
          type: integer
          minimum: 0
        clearedRequiredCount:
          type: integer
          minimum: 0
        actionRequiredCount:
          type: integer
          minimum: 0
        notRequiredCount:
          type: integer
          minimum: 0
        undeterminedCount:
          type: integer
          minimum: 0
      description: >-
        Counts are independent. Exemptions and unresolved applicability are not clearances. No completion
        percentage or automatic closure.
    StudentRequestStatus:
      type: string
      enum:
        - IN_PROGRESS
        - COMPLETED
        - CANCELLED
      description: >-
        Only IN_PROGRESS occupies the active slot. Closed requests retain their outcome and a recorded
        closedAt. Status writers are a later task.
    StudentDashboard:
      type: object
      required:
        - profile
        - activeRequest
        - departments
        - progress
        - history
      additionalProperties: false
      properties:
        profile:
          $ref: '#/components/schemas/StudentProfile'
        activeRequest:
          type: object
          required:
            - id
            - requestReference
            - reason
            - status
            - isActive
            - submittedAt
            - closedAt
          additionalProperties: false
          properties:
            id:
              type: string
              format: uuid
              readOnly: true
            requestReference:
              type: string
              readOnly: true
              description: >-
                Stable Student reference: SC- followed by 32 uppercase UUID hex characters. Not an ordered
                sequence.
            reason:
              $ref: '#/components/schemas/StudentRequestReason'
            status:
              $ref: '#/components/schemas/StudentRequestStatus'
            isActive:
              type: boolean
              readOnly: true
              description: True exactly when status is IN_PROGRESS.
            submittedAt:
              type: string
              format: date-time
              readOnly: true
            closedAt:
              type: string
              format: date-time
              readOnly: true
              nullable: true
          nullable: true
        departments:
          type: array
          items:
            $ref: '#/components/schemas/StudentDepartment'
        progress:
          type: object
          required:
            - requiredCount
            - clearedRequiredCount
            - actionRequiredCount
            - notRequiredCount
            - undeterminedCount
          additionalProperties: false
          properties:
            requiredCount:
              type: integer
              minimum: 0
            clearedRequiredCount:
              type: integer
              minimum: 0
            actionRequiredCount:
              type: integer
              minimum: 0
            notRequiredCount:
              type: integer
              minimum: 0
            undeterminedCount:
              type: integer
              minimum: 0
          description: >-
            Counts are independent. Exemptions and unresolved applicability are not clearances. No completion
            percentage or automatic closure.
          nullable: true
        history:
          type: object
          required:
            - closedRequestCount
            - latestClosedRequest
          additionalProperties: false
          properties:
            closedRequestCount:
              type: integer
              minimum: 0
            latestClosedRequest:
              type: object
              required:
                - id
                - requestReference
                - reason
                - status
                - isActive
                - submittedAt
                - closedAt
              additionalProperties: false
              properties:
                id:
                  type: string
                  format: uuid
                  readOnly: true
                requestReference:
                  type: string
                  readOnly: true
                  description: >-
                    Stable Student reference: SC- followed by 32 uppercase UUID hex characters. Not an ordered
                    sequence.
                reason:
                  $ref: '#/components/schemas/StudentRequestReason'
                status:
                  $ref: '#/components/schemas/StudentRequestStatus'
                isActive:
                  type: boolean
                  readOnly: true
                  description: True exactly when status is IN_PROGRESS.
                submittedAt:
                  type: string
                  format: date-time
                  readOnly: true
                closedAt:
                  type: string
                  format: date-time
                  readOnly: true
                  nullable: true
              nullable: true
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
      required:
      - email
      - password
      additionalProperties: false
    LoginResult:
      type: object
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum: [Bearer]
          example: Bearer
        expiresIn:
          type: integer
          minimum: 60
          maximum: 3600
          description: JWT_ACCESS_TTL_SECONDS; defaults to 900 seconds
        user:
          $ref: '#/components/schemas/CurrentUser'
      required:
      - accessToken
      - tokenType
      - expiresIn
      - user
      additionalProperties: false
    CurrentUser:
      type: object
      description: Current local shared account fields; STUDENT role is pending Issue 16 integration, not in this branch's enum.
      properties:
        id: &id002
          type: string
          format: uuid
        email:
          type: string
          format: email
        fullName:
          type: string
        role:
          type: string
          enum:
          - EMPLOYEE
          - HR_OFFICER
          - APPROVER
          - SYSTEM_ADMIN
      required:
      - id
      - email
      - fullName
      - role
      additionalProperties: false
    CreateCaseRequest:
      type: object
