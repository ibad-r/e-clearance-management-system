openapi: 3.0.3
info:
  title: E-Clearance Employee MVP API
  version: 1.1.0-draft
  description: Draft API contract for Faculty of Computing Employee Clearance MVP. HR-policy mappings unconfirmed; controlled
    departmental data only. No real university integration. Issue 11 prepares employee-initiated APIs; protected employee
    routes remain unmounted in production until verified authentication middleware is integrated. Older HR initiation and
    separate employee submission operations are retained as legacy planned contracts outside Issue 11.
servers:
- url: http://localhost:4000/api/v1
  description: Local development; use HTTPS for deployed environment
tags:
- name: Auth
- name: Employee
- name: Notifications
- name: HR
- name: Approver
- name: System Admin
- name: Certificates
security:
- bearerAuth: []
paths:
  /auth/login:
    post:
      tags:
      - Auth
      summary: Sign in with pre-created account
      description: No public self-registration in this MVP.
      operationId: post_auth_login
      x-required-roles:
      - PUBLIC
      x-implementation-priority: P0
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/LoginResult'
                required:
                - data
                additionalProperties: false
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found or hidden by access policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Invalid state transition or duplicate active request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Semantic validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/me:
    get:
      tags:
      - Auth
      summary: Read signed-in user and role
      description: Never trust a role supplied by the client.
      operationId: get_auth_me
      x-required-roles:
      - AUTHENTICATED
      x-implementation-priority: P0
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
