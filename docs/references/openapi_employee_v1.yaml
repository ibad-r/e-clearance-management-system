  /hr/cases/{caseId}/confirm-departments:
    post:
      tags:
        - HR
      summary: Confirm applicable Employee departments
      description: Strict UUID set plus expected revision; empty query. Lock parent/profile, validate
        scope/category/questionnaire/catalog and selected active mappings, persist HR actor/time/revision and only
        selected rule snapshots, then synchronously verify and aggregate with transactional audits. HR may deviate from
        advice and cannot supply results. Same set (order independent) plus original revision safely returns current
        saved result without checks/rows/audits, including after completion. Other sets/stale revisions conflict.
        Missing evidence stays CHECKING; failures OUTSTANDING/ACTION_REQUIRED. All-clear completion requires explicit
        DEPARTMENTS_ONLY policy; otherwise stays IN_PROGRESS. Internal retry/recheck foundations add no public APIs.
      x-implementation-status: implemented
      x-production-mounted: true
      x-required-roles:
        - HR_OFFICER
      parameters:
        - $ref: "#/components/parameters/caseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmDepartmentsRequest"
      responses:
        "200":
          description: Saved scoped case projection; data envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/HrCase"
                required:
                  - data
                additionalProperties: false
        "400":
          description: "VALIDATION_ERROR: malformed JSON"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "UNAUTHORIZED: missing/invalid/expired token, inactive account, or signed/database role disagreement"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "FORBIDDEN: only HR_OFFICER with explicitly configured category scope; Admin/Approver do not inherit access"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "NOT_FOUND: missing, non-FC, out-of-scope or self-linked case; no existence disclosure"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "STALE_HR_SELECTION or INVALID_STATUS_TRANSITION: reload; no reassignment endpoint"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: "VALIDATION_ERROR: invalid UUID, status, body, query, duplicate/empty/oversized selection or disallowed
            catalog IDs"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "INTERNAL_SERVER_ERROR: safe unexpected failure; mutations and audits roll back together"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: "WORKFLOW_CONFIGURATION_INVALID: missing catalog, ordering approval, selected active template/rule/category
            mappings; retain pending HR with no partial children"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      operationId: post_hr_confirm_departments
components:
  responses:
    StudentUnauthorized:
      description: '401 UNAUTHORIZED: invalid, absent, expired or inactive-user JWT.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    StudentForbidden:
      description: '403 FORBIDDEN: verified account is not a Student.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    StudentNotFound:
      description: >-
        404 STUDENT_PROFILE_NOT_FOUND for an absent linked profile, or NOT_FOUND for a missing or foreign request.
        Foreign existence is never disclosed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    StudentValidationError:
      description: >-
        422 VALIDATION_ERROR for invalid fields, UUID or query parameters; PROFILE_MISMATCH for submitted academic
        values differing from the stored profile.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    StudentInternalError:
      description: '500 INTERNAL_SERVER_ERROR: sanitized unexpected failure.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    EmployeeUnauthorized:
      description: Shared verifier returns UNAUTHORIZED for absent/invalid/expired tokens, inactive/absent users or
        signed/database role mismatch. The Employee principal/service seam can return UNAUTHENTICATED for a
        missing/malformed principal or absent user.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    EmployeeForbidden:
      description: Shared role gate rejects non-EMPLOYEE accounts; the Employee service also rejects ineligible role/activity
        or non-FC profiles; FORBIDDEN. An inactive user detected by shared authentication returns 401 first.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    EmployeeNotFound:
      description: Linked employee or owned case not found; NOT_FOUND
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    EmployeeConflict:
      description: Existing nonterminal case, request-code conflict or concurrent case creation conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    EmployeeValidationError:
      description: Invalid strict body, UUID path or status query; VALIDATION_ERROR
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    EmployeeConfigurationError:
      description: Active category workflow missing or configuration ineligible; WORKFLOW_NOT_CONFIGURED or
        WORKFLOW_CONFIGURATION_INVALID
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    EmployeeInternalError:
      description: Unexpected failure; INTERNAL_SERVER_ERROR without driver details or credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    StudentUnavailable:
      description: >-
        503 STUDENT_CONFIGURATION_INVALID, REQUEST_REFERENCE_UNAVAILABLE or REQUEST_CREATION_UNAVAILABLE. No partial
        submission is committed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Current HS256 JWT; issuer e-clearance-backend, audience e-clearance-api, shared users.id in sub. Shared
        verifier reloads the active user and checks signed/database role agreement.
  parameters:
    caseId:
      name: caseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    issueId:
      name: issueId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    resolutionId:
      name: resolutionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    notificationId:
      name: notificationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    approvalId:
      name: approvalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    employeeId:
      name: employeeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    departmentId:
      name: departmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    certificateId:
      name: certificateId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    templateId:
      name: templateId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    token:
      name: token
      in: path
      required: true
      schema:
        type: string
        minLength: 24
  schemas:
    StudentProfile:
      type: object
      required:
        - sapId
        - studentName
        - registrationNumber
        - fatherName
        - program
        - semester
      additionalProperties: false
      properties:
        sapId:
          type: string
          readOnly: true
          description: Unique opaque SAP string from student_profiles.sap_id; preserve case and leading zeros.
        studentName:
          type: string
          readOnly: true
          description: Current users.fullName; captured at request submission.
        registrationNumber:
          type: string
          minLength: 1
          pattern: \S
          description: Nonblank string, retained exactly; must match the stored profile on submission.
        fatherName:
          type: string
          minLength: 1
          pattern: \S
          description: Nonblank string, retained exactly; must match the stored profile on submission.
        program:
          type: string
          minLength: 1
          pattern: \S
          description: Nonblank string, retained exactly; must match the stored profile on submission.
        semester:
          type: string
          minLength: 1
          pattern: \S
          description: Nonblank string, retained exactly; must match the stored profile on submission.
      description: >-
        Linked profile resolved using verified JWT users.id. No client owner selector or profile editing endpoint.
    StudentRequestReason:
      type: string
      enum:
        - degree completed
        - discontinuing studies
    CreateStudentRequest:
      type: object
      required:
        - registrationNumber
        - fatherName
        - program
        - semester
        - reason
      additionalProperties: false
      properties:
        registrationNumber:
          type: string
          minLength: 1
          pattern: \S
          description: Nonblank string, retained exactly; must match the stored profile on submission.
        fatherName:
          type: string
          minLength: 1
          pattern: \S
          description: Nonblank string, retained exactly; must match the stored profile on submission.
        program:
          type: string
          minLength: 1
          pattern: \S
          description: Nonblank string, retained exactly; must match the stored profile on submission.
        semester:
          type: string
          minLength: 1
          pattern: \S
          description: Nonblank string, retained exactly; must match the stored profile on submission.
        reason:
          $ref: '#/components/schemas/StudentRequestReason'
      description: >-
        Exactly five fields. Academic strings must exactly match PostgreSQL profile values. Identity and status fields
        are rejected.
    StudentDepartmentCode:
      type: string
      enum:
        - LIBRARY
        - FEE_DUES
        - STUDENT_SERVICE
        - LABORATORY
        - COORDINATION_OFFICE
    StudentDepartmentStatus:
      type: string
      enum:
        - PENDING
        - IN_REVIEW
        - CLEARED
        - ACTION_REQUIRED
        - NOT_REQUIRED
    StudentDepartmentApplicability:
      type: string
      enum:
        - REQUIRED
        - NOT_REQUIRED
        - UNDETERMINED
    StudentDepartment:
      type: object
      required:
        - departmentCode
        - displayName
        - applicability
        - status
        - remarks
        - updatedAt
      additionalProperties: false
      properties:
        departmentCode:
          $ref: '#/components/schemas/StudentDepartmentCode'
        displayName:
          type: string
        applicability:
          $ref: '#/components/schemas/StudentDepartmentApplicability'
        status:
          $ref: '#/components/schemas/StudentDepartmentStatus'
        remarks:
          type: string
          nullable: true
          description: Nullable approved configured plain text (up to 500 characters) from separate student-visible storage. Never
            historical private remarks or raw evidence. Null when wording is not configured or for cleared rows.
          maxLength: 500
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: Null until an actual department update is recorded.
      description: >-
        All five persisted departments are returned independently. No Student status writes or sequential unlocking.
      oneOf:
        - properties:
            applicability:
              enum:
                - REQUIRED
            status:
              enum:
                - PENDING
                - IN_REVIEW
                - CLEARED
                - ACTION_REQUIRED
        - properties:
            applicability:
              enum:
                - NOT_REQUIRED
            status:
              enum:
                - NOT_REQUIRED
        - properties:
            applicability:
              enum:
                - UNDETERMINED
            status:
              enum:
                - PENDING
    StudentRequestSummary:
      type: object
      required:
        - id
        - requestReference
        - reason
        - status
        - isActive
        - submittedAt
        - closedAt
      additionalProperties: false
      properties:
