openapi: 3.0.3
info:
  title: E-Clearance API - Employee MVP and Student clearance
  version: 1.3.0
  description: >-
    Implemented shared email/password JWT authentication, Employee APIs and Issue 18 Student
    profile/dashboard/request APIs. Student initial rules were approved by the owner on 13 November 2026.
    Verified by isolated PostgreSQL 18 tests. SAP-ID login remains owned by Issue 16; no SAP-ID login shape or
    real university integration is introduced. Older HR and approval operations remain legacy planned
    contracts.
  x-student-contract-status: implemented
  x-student-decision-register: ../implementation/student-api-contract.md
  x-student-flutter-handoff: ../implementation/student-flutter-handoff.md
  x-student-implementation: ../implementation/issue-18-implementation.md
servers:
- url: http://localhost:4000/api/v1
  description: Local development; use HTTPS for deployed environment
tags:
- name: Auth
- name: Employee
- name: Student
  description: Implemented own-profile/request APIs; see the Issue 18 implementation handoff.
- name: Notifications
- name: HR
- name: Approver
- name: System Admin
- name: Certificates
security:
- bearerAuth: []
paths:
  /auth/login:
    post:
      tags:
      - Auth
      summary: Sign in with pre-created account
      description: >-
        Verified current strict email/password login for an active Admin-pre-created shared account; no signup.
        Email is lowercased for exact lookup, without trimming or university-domain restrictions; password is not trimmed.
        Extra fields, including sapId or identifier, fail validation. Student email-or-SAP-ID login is a product direction
        pending Issue 16 input/lookup confirmation; it is not supported by this local branch.
      operationId: post_auth_login
      x-required-roles:
      - PUBLIC
      x-implementation-priority: P0
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Shared login response at the top level; no data envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '400':
          description: VALIDATION_ERROR for invalid strict body or malformed JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: UNAUTHORIZED with generic Invalid credentials for unknown, inactive or incorrect-password accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: INTERNAL_SERVER_ERROR for unexpected service or token-configuration failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/me:
    get:
      tags:
      - Auth
      summary: Read signed-in user and role
      description: >-
        Verifies the Bearer JWT, reloads the active user and requires signed/database role agreement.
        Returns shared account id, email, fullName and role; this is not a Student academic profile.
        Never trust a role supplied by the client.
      operationId: get_auth_me
      x-required-roles:
      - AUTHENTICATED
      x-implementation-priority: P0
      responses:
        '200':
          description: Shared account in the user field; no data envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/CurrentUser'
                required:
                - user
                additionalProperties: false
        '401':
          description: UNAUTHORIZED for missing/invalid/expired token, inactive/absent user or role mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: INTERNAL_SERVER_ERROR for unexpected active-user lookup failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /student/profile:
    get:
      tags:
        - Student
      operationId: get_student_profile
      summary: Read own Student academic profile
      security:
        - bearerAuth: []
      x-required-roles:
        - STUDENT
      x-implementation-status: implemented
      x-production-mounted: true
      description: >-
        Resolve student_profiles.user_id from verified req.auth.userId. Missing links return 404 without
        fabricated values. Query parameters are not accepted.
      responses:
        '200':
          description: Persisted Student data
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                additionalProperties: false
                properties:
                  data:
                    $ref: '#/components/schemas/StudentProfile'
        '401':
          $ref: '#/components/responses/StudentUnauthorized'
        '403':
          $ref: '#/components/responses/StudentForbidden'
        '404':
          $ref: '#/components/responses/StudentNotFound'
        '422':
          $ref: '#/components/responses/StudentValidationError'
        '500':
          $ref: '#/components/responses/StudentInternalError'
  /student/dashboard:
    get:
      tags:
        - Student
      operationId: get_student_dashboard
      summary: Read own active request, independent progress and closed history
      security:
        - bearerAuth: []
      x-required-roles:
        - STUDENT
      x-implementation-status: implemented
      x-production-mounted: true
      description: >-
        A repeatable-read transaction returns a consistent owner snapshot. No active request means
        activeRequest null, departments [], progress null. History counts COMPLETED and CANCELLED requests.
        Query parameters are not accepted.
      responses:
        '200':
          description: Persisted Student data
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                additionalProperties: false
                properties:
                  data:
                    $ref: '#/components/schemas/StudentDashboard'
        '401':
          $ref: '#/components/responses/StudentUnauthorized'
        '403':
          $ref: '#/components/responses/StudentForbidden'
        '404':
          $ref: '#/components/responses/StudentNotFound'
        '422':
          $ref: '#/components/responses/StudentValidationError'
        '500':
          $ref: '#/components/responses/StudentInternalError'
        '503':
          $ref: '#/components/responses/StudentUnavailable'
  /student/requests:
    post:
      tags:
        - Student
      operationId: post_student_requests
      summary: Submit own Student clearance request
      security:
        - bearerAuth: []
      x-required-roles:
        - STUDENT
      x-implementation-status: implemented
      x-production-mounted: true
      description: >-
        Academic fields must exactly match the stored profile. SAP ID and name are derived and captured by the
        server. The database permits one IN_PROGRESS request. The parent and all five departments commit
        atomically. Owner-approved initial rules allow unresolved Laboratory submission; four ordinary
        departments are REQUIRED/PENDING and Laboratory is UNDETERMINED/PENDING. Subsequent applicability
        comes from an explicit server resolver and is persisted per request. Retry has no idempotency-key
        contract; inspect existing requests after uncertain network outcomes. Query parameters are not
        accepted.
      responses:
        '201':
          description: Persisted Student data
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                additionalProperties: false
                properties:
                  data:
                    $ref: '#/components/schemas/StudentRequest'
        '400':
          description: 'Malformed JSON: VALIDATION_ERROR.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/StudentUnauthorized'
        '403':
          $ref: '#/components/responses/StudentForbidden'
        '404':
          $ref: '#/components/responses/StudentNotFound'
        '409':
          description: 'ACTIVE_REQUEST_EXISTS: an IN_PROGRESS request already exists.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/StudentValidationError'
        '500':
          $ref: '#/components/responses/StudentInternalError'
        '503':
          $ref: '#/components/responses/StudentUnavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStudentRequest'
    get:
      tags:
        - Student
      operationId: get_student_requests
      summary: List own current and historical requests
      security:
        - bearerAuth: []
      x-required-roles:
        - STUDENT
      x-implementation-status: implemented
      x-production-mounted: true
      description: >-
        Unpaginated list, newest submittedAt first with descending UUID as a deterministic tie-breaker. Empty
        list returns data []. Query parameters are not accepted.
      responses:
        '200':
          description: Persisted Student data
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/StudentRequestSummary'
        '401':
          $ref: '#/components/responses/StudentUnauthorized'
        '403':
          $ref: '#/components/responses/StudentForbidden'
        '404':
          $ref: '#/components/responses/StudentNotFound'
        '422':
          $ref: '#/components/responses/StudentValidationError'
        '500':
          $ref: '#/components/responses/StudentInternalError'
  /student/requests/{requestId}:
    get:
      tags:
        - Student
      operationId: get_student_requests__requestId_
      summary: Read own request and persisted department states
      security:
        - bearerAuth: []
      x-required-roles:
        - STUDENT
      x-implementation-status: implemented
      x-production-mounted: true
      description: >-
        Verified Student ownership constrains the UUID lookup. Missing and foreign requests return the same
        safe NOT_FOUND response. Identity is the submission snapshot. Query parameters are not accepted.
      responses:
        '200':
          description: Persisted Student data
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                additionalProperties: false
                properties:
                  data:
                    $ref: '#/components/schemas/StudentRequest'
        '401':
          $ref: '#/components/responses/StudentUnauthorized'
        '403':
          $ref: '#/components/responses/StudentForbidden'
        '404':
          $ref: '#/components/responses/StudentNotFound'
        '422':
          $ref: '#/components/responses/StudentValidationError'
        '500':
          $ref: '#/components/responses/StudentInternalError'
        '503':
          $ref: '#/components/responses/StudentUnavailable'
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
  /employee/profile:
    get:
      tags:
      - Employee
      summary: Read the authenticated FC employee profile
      description: Uses the verified users.id to find the linked employee. Only active employee accounts in FC are eligible.
      operationId: get_employee_profile
      x-required-roles:
      - EMPLOYEE
      x-implementation-priority: P0
      x-production-mounted: true
      responses:
        '200':
          description: Public employee profile; no authentication fields
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/EmployeeProfile'
                required:
                - data
                additionalProperties: false
        '401':
          $ref: '#/components/responses/EmployeeUnauthorized'
        '403':
