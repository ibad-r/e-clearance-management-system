info:

  title: E-Clearance API - Student automation and Employee HR selection
  version: 1.4.0
  description: Implemented shared email/SAP/combined-identifier JWT authentication, five Student APIs, four Employee APIs
    and three scoped HR APIs. Automated verification uses explicit server configuration and synthetic evidence; missing
    policy or evidence never implies clearance. Section 16 institutional decisions remain unresolved. Legacy designs are
    individually marked unimplemented. No Student department PATCH exists.

  title: E-Clearance API - Employee MVP and Student clearance
  version: 1.4.0
  description: >-
    Shared email/password and Student SAP-ID/password JWT authentication, Employee APIs and Issue 18 Student
    profile/dashboard/request APIs. Student initial rules were approved by the owner on 13 November 2026.
    The combined login identifier and SAP-ID verification contract were confirmed on 22 November 2026.
    No real university integration or automatic provisioning is introduced.
    Older HR and approval operations remain legacy planned contracts.

