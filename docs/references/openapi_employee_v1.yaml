      properties:
        lastWorkingDate:
          type: string
          format: date
          description: A real ISO calendar date with year 0001 through 9999; no institutional date cutoff is assumed.
          pattern: '^(?!0000)[0-9]{4}-[0-9]{2}-[0-9]{2}$'
        reasonForLeaving:
          type: string
          minLength: 3
          maxLength: 500
        employeeRemarks:
          type: string
          maxLength: 1000
          nullable: true
