                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/EmployeeUnauthorized'
        '403':
          $ref: '#/components/responses/EmployeeForbidden'
        '404':
          $ref: '#/components/responses/EmployeeNotFound'
        '422':
          $ref: '#/components/responses/EmployeeValidationError'
        '503':
          $ref: '#/components/responses/EmployeeConfigurationError'
        '500':
          $ref: '#/components/responses/EmployeeInternalError'
  /employee/cases/{caseId}/submit:
    post:
      tags:
      - Employee
      summary: Submit HR-initiated clearance case
      description: Legacy planned HR-initiation flow outside Issue 11; not implemented by the employee case router. Issue 11 self-submits through POST /employee/cases and starts stages LOCKED.
      deprecated: true
      x-implementation-status: legacy-planned
      operationId: post_employee_cases__caseId__submit
      x-required-roles:
      - EMPLOYEE
      x-implementation-priority: P0
      parameters:
      - $ref: '#/components/parameters/caseId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitCaseRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CaseDetail'
                required:
                - data
                additionalProperties: false
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found or hidden by access policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Invalid state transition or duplicate active request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Semantic validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
