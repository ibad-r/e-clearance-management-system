  /employee/profile:
    get:
      tags:
      - Employee
      summary: Read the authenticated FC employee profile
      description: Uses the verified users.id to find the linked employee. Only active employee accounts in FC are eligible.
      operationId: get_employee_profile
      x-required-roles:
      - EMPLOYEE
      x-implementation-priority: P0
      x-production-mounted: false
      responses:
        '200':
          description: Public employee profile; no authentication fields
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/EmployeeProfile'
                required:
                - data
                additionalProperties: false
        '401':
          $ref: '#/components/responses/EmployeeUnauthorized'
        '403':
          $ref: '#/components/responses/EmployeeForbidden'
        '404':
          $ref: '#/components/responses/EmployeeNotFound'
        '503':
          $ref: '#/components/responses/EmployeeConfigurationError'
        '500':
          $ref: '#/components/responses/EmployeeInternalError'
  /employee/cases:
    post:
      tags:
      - Employee
      summary: Create and submit the authenticated employee's own clearance case
      description: >-
        Derives employeeId and initiatedById from the verified active FC employee account; client identity fields are
        rejected. Selects the active workflow for the employee category and atomically saves an IN_PROGRESS request,
        submittedAt, stage/rule snapshots, WAITING approval snapshots and a safe audit event. All configured stages start
        LOCKED; no departmental rule engine or automatic approval is performed. Only COMPLETED and CANCELLED release
        the employee's active-case slot. Missing or invalid workflow configuration returns 503 without creating fake data.
      operationId: post_employee_cases
      x-required-roles:
      - EMPLOYEE
      x-implementation-priority: P0
      x-production-mounted: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmployeeCaseRequest'
      responses:
        '201':
          description: Created and submitted with LOCKED stages and WAITING approvals
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CaseDetail'
                required:
                - data
                additionalProperties: false
        '400':
          description: Malformed JSON; handled by the existing application parser
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/EmployeeUnauthorized'
        '403':
          $ref: '#/components/responses/EmployeeForbidden'
        '404':
          $ref: '#/components/responses/EmployeeNotFound'
        '409':
          $ref: '#/components/responses/EmployeeConflict'
        '422':
          $ref: '#/components/responses/EmployeeValidationError'
        '503':
          $ref: '#/components/responses/EmployeeConfigurationError'
        '500':
          $ref: '#/components/responses/EmployeeInternalError'
    get:
      tags:
      - Employee
      summary: List own clearance cases
      description: Lists only cases belonging to the verified linked FC employee, including self-submitted cases and history.
      operationId: get_employee_cases
      x-production-mounted: false
      x-required-roles:
      - EMPLOYEE
      x-implementation-priority: P0
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum: &id001
          - PENDING_SUBMISSION
          - IN_PROGRESS
          - ACTION_REQUIRED
          - AWAITING_APPROVAL
          - RETURNED_FOR_CORRECTION
          - COMPLETED
          - CANCELLED
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CaseList'
                required:
                - data
                additionalProperties: false
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found or hidden by access policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Invalid state transition or duplicate active request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Semantic validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/EmployeeConfigurationError'
        '500':
          $ref: '#/components/responses/EmployeeInternalError'
  /employee/cases/{caseId}:
    get:
      tags:
