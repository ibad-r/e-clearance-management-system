  /student/requests:
    post:
      tags:
        - Student
      operationId: post_student_requests
      summary: Submit own Student clearance request
      security:
        - bearerAuth: []
      x-required-roles:
        - STUDENT
      x-implementation-status: implemented
      x-production-mounted: true
      description: Preserves strict five-field body, verified ownership, academic snapshots and active/reference safeguards.
        Creates exactly five rows and synchronously persists independently computed configured results, safe reasons,
        pinned attempt provenance and audits. Missing rules/evidence stay pending; Laboratory stays undetermined until
        explicit approved applicability configuration. Completion requires the configured DEPARTMENTS_ONLY policy and
        five resolved valid rows; closedAt and audit are atomic.
      responses:
        '201':
          description: Persisted Student data
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                additionalProperties: false
                properties:
                  data:
                    $ref: '#/components/schemas/StudentRequest'
        '400':
          description: 'Malformed JSON: VALIDATION_ERROR.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/StudentUnauthorized'
        '403':
          $ref: '#/components/responses/StudentForbidden'
        '404':
          $ref: '#/components/responses/StudentNotFound'
        '409':
          description: 'ACTIVE_REQUEST_EXISTS: an IN_PROGRESS request already exists.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/StudentValidationError'
        '500':
          $ref: '#/components/responses/StudentInternalError'
        '503':
          $ref: '#/components/responses/StudentUnavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStudentRequest'
    get:
      tags:
        - Student
      operationId: get_student_requests
      summary: List own current and historical requests
      security:
        - bearerAuth: []
      x-required-roles:
        - STUDENT
      x-implementation-status: implemented
      x-production-mounted: true
      description: >-
        Unpaginated list, newest submittedAt first with descending UUID as a deterministic tie-breaker. Empty list
        returns data []. Query parameters are not accepted.
      responses:
        '200':
          description: Persisted Student data
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/StudentRequestSummary'
        '401':
          $ref: '#/components/responses/StudentUnauthorized'
        '403':
          $ref: '#/components/responses/StudentForbidden'
        '404':
          $ref: '#/components/responses/StudentNotFound'
        '422':
          $ref: '#/components/responses/StudentValidationError'
        '500':
          $ref: '#/components/responses/StudentInternalError'
