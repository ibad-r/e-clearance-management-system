
name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-checks:
    name: Backend Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: e_clearance_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: e_clearance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U e_clearance_test -d e_clearance_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://e_clearance_test:test_password@localhost:5432/e_clearance_test


    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

        
      - name: Lint backend
        run: npm run lint


      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Build backend
        run: npm run build

      - name: Run tests
        run: npm test

      
      - name: Run tests
        run: npm test

      - name: Run PostgreSQL integration tests
        run: npm run test:integration

